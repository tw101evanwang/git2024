<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>regexpParse</title>
  <style>
    body {
      background: #6b6659;
    }
  </style>
</head>

<body>
  <svg></svg>
  <script>
    function parseRegex(input) {
      let i = 0
      let groupIndex = 0
      return branchess()
      function onePart() {
        let atom
        if (input[i] === '\\') {
          atom = escape()
        } else if (input[i] === '(') {
          atom = Group()
        } else if (input[i] === '[') {
          atom = characterClass()
        } else {
          atom = charSinglechar()
        }
        if (i < input.length && (input[i] === '?' || input[i] === '*' || input[i] === '+' || input[i] === '{')) {
          return Quantifier(atom)
        }
        return atom
      }
      function charSinglechar() {
        let node = {
          type: 'Character',
          start: i,
          end: 0,
          raw: '',
          character: input[i],
        }
        i++
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      //转义字符
      function escape() {
        let node = {
          type: 'Escape',
          start: i,
          end: 0,
          raw: '',
          escape: '',
        }
        i++
        node.escape = input[i]
        i++
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function Quantifier(repeatElement) {
        let node = {
          type: 'Quantifier',
          start: repeatElement.start,
          end: 0,
          raw: '',
          min: 0,
          max: Infinity,
          greedy: true,
          repeatElement: repeatElement,
        }
        if (input[i] === '?') {
          i++
          node.max = 1
        } else if (input[i] === '*') {
          i++
        } else if (input[i] === '+') {
          i++
          node.min = 1
        } else if (input[i] === '{') {
          i++
          let start = i
          while (input[i] !== ',' && input[i] !== '}') {
            i++
          }
          node.min = Number(input.slice(start, i))
          if (input[i] === '}') {
            node.max = node.min
            i++
          } else if (input[i] === ',') {
            i++
            start = i
            while (i < input.length && input[i] !== '}') {
              i++
            }
            if (start === i) {
              node.max = Infinity
            } else {
              node.max = Number(input.slice(start, i))
            }
            if (input[i] === '}') {
              i++
            }
          }
        }
        //非贪婪匹配
        if (input[i] === '?') {
          node.greedy = false
          i++
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function classPart() {
        if (input[i] === '\\') {
          return escape()
        }
        return charSinglechar()
      }
      function characterClass() {
        let node = {
          type: 'CharacterClass',
          start: i,
          end: 0,
          raw: '',
          invert: false,
          characterclass: []
        }
        i++
        if (input[i] === '^') {
          node.invert = true
          i++
        }
        while (i < input.length && input[i] !== ']') {
          node.characterclass.push(classPart())
        }
        if (input[i] === ']') {
          i++
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function branchess() {
        let bran = []
        while (i < input.length && input[i] !== ')') {
          if (input[i] === '|') {
            i++
            continue
          }
          bran.push(branch())
        }
        return bran
      }
      function branch() {
        let node = {
          type: 'Branch',
          start: i,
          end: 0,
          raw: '',
          element: [],
        }
        while (i < input.length && input[i] !== '|' && input[i] !== ')') {
          let ele = onePart()
          node.element.push(ele)
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
      function Group() {
        let node = {
          type: 'Group',
          start: i,
          end: 0,
          raw: '',
          groupIndex: 0,
          capture: false,
          assert: false,
          positive: null,
          lookhead: null,
          groupName: '',
          branches: [],
        }
        i++
        if (input[i] === '?') {
          i++
          if (input[i] === ':') {
            i++
            node.capture = false
          }
          else if (input[i] === '=') {
            i++
            node.assert = true
            node.positive = true
            node.lookhead = true
          }
          else if (input[i] === '!') {
            i++
            node.assert = true
            node.positive = false
            node.lookhead = true
          }
          else if (input[i] === '<') {
            i++
            if (input[i] === '=') {
              i++
              node.assert = true
              node.positive = true
              node.lookhead = false
            }
            else if (input[i] === '!') {
              i++
              node.assert = true
              node.positive = false
              node.lookhead = false
            }
            else {
              node.capture = true
              let start = i
              while (input[i] !== '>') {
                i++
              }
              node.groupName = input.slice(start, i)
              i++
            }
          }
        } else {
          node.capture = true
          groupIndex++
          node.groupIndex = groupIndex
        }
        node.branches.push(branch())
        while (i < input.length && input[i] === '|') {
          i++
          node.branches.push(branch())
        }
        if (input[i] === ')') {
          i++
        }
        node.end = i
        node.raw = input.slice(node.start, node.end)
        return node
      }
    }
    function draw(node) {
      if (node.type === 'Character') {
        return drawcharSinglechar(node)
      }
      if (node.type === 'Escape') {
        return drawescape(node)
      }
      if (node.type === 'Quantifier') {
        return drawQuantifier(node)
      }
      if (node.type === 'CharacterClass') {
        return drawcharacterClass(node)
      }
      if (node.type === 'Branch') {
        return drawbranch(node)
      }
      if (node.type === 'Group') {
        return drawGroup(node)
      }
    }
    let svg = document.querySelector('svg')
    svg.setAttribute('width', '1000')
    svg.setAttribute('height', '1000')
    function drawcharSinglechar(node) {
      let width = 20
      let height = 20
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
      rect.setAttribute('width', width)
      rect.setAttribute('height', height)
      rect.setAttribute('rx', '5')
      rect.setAttribute('ry', '5')
      rect.setAttribute('fill', '#dae9e5')
      rect.setAttribute('stroke', '#dae9e5')
      rect.setAttribute('stroke-width', '1')
      let text = document.createElementNS('http://www.w3.org/2000/svg', 'text')
      text.setAttribute('x', width / 2)
      text.setAttribute('y', height / 2)
      text.setAttribute('text-anchor', 'middle')
      text.setAttribute('dominant-baseline', 'central')
      text.setAttribute('font-size', '10')
      text.textContent = node.character
      g.appendChild(rect)
      g.appendChild(text)
      return {
        ele: g,
        width: width,
        height: height,
      }
    }
    function drawescape(node) {
      let width = 20
      let height = 20
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
      rect.setAttribute('width', width)
      rect.setAttribute('height', height)
      rect.setAttribute('rx', '5')
      rect.setAttribute('ry', '5')
      rect.setAttribute('fill', 'blue')
      rect.setAttribute('stroke', 'green')
      rect.setAttribute('stroke-width', '1')
      let text = document.createElementNS('http://www.w3.org/2000/svg', 'text')
      text.setAttribute('x', width / 2)
      text.setAttribute('y', height / 2)
      text.setAttribute('text-anchor', 'middle')
      text.setAttribute('dominant-baseline', 'central')
      text.setAttribute('font-size', '10')
      text.textContent = node.raw
      g.appendChild(rect)
      g.appendChild(text)
      return {
        ele: g,
        width: width,
        height: height,
      }
    }
    function drawQuantifier(node) {
      let gap = 20
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let childc = draw(node.repeatElement)
      g.appendChild(childc.ele)
      //a+
      if (node.min === 1 && node.max === Infinity) {
        let rPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        rPath.setAttribute('d', `M ${childc.width} ${childc.height / 2} C ${childc.width + gap / 2} ${childc.height / 2}, ${childc.width + gap / 2} ${childc.height / 2 + gap}, ${childc.width} ${childc.height / 2 + gap}`)
        rPath.setAttribute('fill', 'none')
        rPath.setAttribute('stroke', 'red')
        rPath.setAttribute('stroke-width', '1')
        g.appendChild(rPath)
        let Lline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        Lline.setAttribute('x1', childc.width + gap / 2 - 3)
        Lline.setAttribute('y1', childc.height * 3 / 4 + gap / 4)
        Lline.setAttribute('x2', childc.width + gap / 2 - 6)
        Lline.setAttribute('y2', childc.height * 3 / 4 + gap / 4 - 3)
        Lline.setAttribute('stroke', 'yellow')
        Lline.setAttribute('stroke-width', 1)
        g.appendChild(Lline)
        let Rline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        Rline.setAttribute('x1', childc.width + gap / 2 - 3)
        Rline.setAttribute('y1', childc.height * 3 / 4 + gap / 4)
        Rline.setAttribute('x2', childc.width + gap / 2)
        Rline.setAttribute('y2', childc.height * 3 / 4 + gap / 4 - 3)
        Rline.setAttribute('stroke', 'yellow')
        Rline.setAttribute('stroke-width', 1)
        g.appendChild(Rline)
        let line = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        line.setAttribute('x1', childc.width)
        line.setAttribute('y1', childc.height / 2 + gap)
        line.setAttribute('x2', 0)
        line.setAttribute('y2', childc.height / 2 + gap)
        line.setAttribute('stroke', 'yellow')
        line.setAttribute('stroke-width', 1)
        g.appendChild(line)
        let lPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        lPath.setAttribute('d', `M 0 ${childc.height / 2} C ${- gap / 2} ${childc.height / 2}, ${- gap / 2} ${childc.height / 2 + gap}, 0 ${childc.height / 2 + gap}`)
        lPath.setAttribute('fill', 'none')
        lPath.setAttribute('stroke', 'red')
        lPath.setAttribute('stroke-width', '1')
        g.appendChild(lPath)
      }
      //a*
      if (node.min === 0 && node.max === Infinity) {
        let rPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        rPath.setAttribute('d', `M ${childc.width} ${childc.height / 2} C ${childc.width + gap / 2} ${childc.height / 2}, ${childc.width + gap / 2} ${childc.height / 2 + gap}, ${childc.width} ${childc.height / 2 + gap}`)
        rPath.setAttribute('fill', 'none')
        rPath.setAttribute('stroke', 'red')
        rPath.setAttribute('stroke-width', '1')
        g.appendChild(rPath)
        let Lline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        Lline.setAttribute('x1', childc.width + gap / 2 - 3)
        Lline.setAttribute('y1', childc.height * 3 / 4 + gap / 4)
        Lline.setAttribute('x2', childc.width + gap / 2 - 6)
        Lline.setAttribute('y2', childc.height * 3 / 4 + gap / 4 - 3)
        Lline.setAttribute('stroke', 'yellow')
        Lline.setAttribute('stroke-width', 1)
        g.appendChild(Lline)
        let Rline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        Rline.setAttribute('x1', childc.width + gap / 2 - 3)
        Rline.setAttribute('y1', childc.height * 3 / 4 + gap / 4)
        Rline.setAttribute('x2', childc.width + gap / 2)
        Rline.setAttribute('y2', childc.height * 3 / 4 + gap / 4 - 3)
        Rline.setAttribute('stroke', 'yellow')
        Rline.setAttribute('stroke-width', 1)
        g.appendChild(Rline)
        let dline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        dline.setAttribute('x1', childc.width)
        dline.setAttribute('y1', childc.height / 2 + gap)
        dline.setAttribute('x2', 0)
        dline.setAttribute('y2', childc.height / 2 + gap)
        dline.setAttribute('stroke', 'yellow')
        dline.setAttribute('stroke-width', 1)
        g.appendChild(dline)
        let lPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        lPath.setAttribute('d', `M 0 ${childc.height / 2} C ${- gap / 2} ${childc.height / 2}, ${- gap / 2} ${childc.height / 2 + gap}, 0 ${childc.height / 2 + gap}`)
        lPath.setAttribute('fill', 'none')
        lPath.setAttribute('stroke', 'red')
        lPath.setAttribute('stroke-width', '1')
        g.appendChild(lPath)
        let tline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        tline.setAttribute('x1', childc.width)
        tline.setAttribute('y1', childc.height / 2 - gap)
        tline.setAttribute('x2', 0)
        tline.setAttribute('y2', childc.height / 2 - gap)
        tline.setAttribute('stroke', 'yellow')
        tline.setAttribute('stroke-width', 1)
        g.appendChild(tline)
        let Path1 = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        Path1.setAttribute('d', `M ${- gap} ${childc.height / 2} C ${- gap / 2} ${childc.height / 2}, ${- gap / 2} ${childc.height / 2 - gap}, 0 ${childc.height / 2 - gap}`)
        Path1.setAttribute('fill', 'none')
        Path1.setAttribute('stroke', 'red')
        Path1.setAttribute('stroke-width', '1')
        g.appendChild(Path1)
        let Path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        Path2.setAttribute('d', `M ${childc.width} ${childc.height / 2 - gap} C ${childc.width + gap / 2} ${childc.height / 2 - gap}, ${childc.width + gap / 2} ${childc.height / 2}, ${childc.width + gap} ${childc.height / 2}`)
        Path2.setAttribute('fill', 'none')
        Path2.setAttribute('stroke', 'red')
        Path2.setAttribute('stroke-width', '1')
        g.appendChild(Path2)
      }
      return {
        ele: g,
        width: childc.width,
        height: childc.height,
      }
    }
    function drawcharacterClass(node) {
      let W = 0
      let H = 0
      let padding = 20
      let gap = 0
      let y = gap
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let Class = []
      for (let i = 0; i < node.characterclass.length; i++) {
        let childc = drawcharSinglechar(node.characterclass[i])//传参错误，不是node.characterclass整个数组，
        Class.push(childc)
        if (childc.width > W) {
          W = childc.width
        }
        if (i !== node.characterclass.length - 1) {
          H += childc.height + gap
        } else {
          H += childc.height
        }
      }
      for (let i = 0; i < Class.length; i++) {
        let childc = Class[i]
        let child = childc.ele
        child.setAttribute('transform', `translate(${gap}, ${y})`)
        if (i !== Class.length - 1) {
          y += childc.height + gap
        } else {
          y += childc.height
        }
        g.appendChild(child)
      }
      let rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
      rect.setAttribute('x', 0)
      rect.setAttribute('y', 0)
      rect.setAttribute('width', W + gap * 2)
      rect.setAttribute('height', H + gap * 2)
      rect.setAttribute('stroke', 'aqua')
      rect.setAttribute('fill', 'none')
      rect.setAttribute('rx', '5')
      rect.setAttribute('ry', '5')
      let leftline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
      leftline.setAttribute('x1', 0)
      leftline.setAttribute('y1', H / 2)
      leftline.setAttribute('x2', - padding)
      leftline.setAttribute('y2', H / 2)
      leftline.setAttribute('stroke', 'yellow')
      leftline.setAttribute('stroke-width', 1)
      g.appendChild(leftline)
      let righttline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
      righttline.setAttribute('x1', padding)
      righttline.setAttribute('y1', H / 2)
      righttline.setAttribute('x2', W + padding)
      righttline.setAttribute('y2', H / 2)
      righttline.setAttribute('stroke', 'yellow')
      righttline.setAttribute('stroke-width', 1)
      g.appendChild(righttline)
      g.appendChild(rect)
      return {
        ele: g,
        width: W + gap * 2,
        height: H
      }
    }
    function drawbranchess(node, content = true) {
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let gap = 20
      let x = 0
      let y = 0
      let H = 0
      let W = 0
      let yc = 0
      let branchess = []
      for (let i = 0; i < node.length; i++) {
        let childc = drawbranch(node[i])
        branchess.push(childc)
        if (childc.width > W) {
          W = childc.width
        }
        if (i !== node.length - 1) {
          H += childc.height + gap
        } else {
          H += childc.height
        }
      }
      for (let i = 0; i < branchess.length; i++) {
        let childc = branchess[i]
        let child = childc.ele
        child.setAttribute('transform', `translate(${gap + (W - childc.width) / 2}, ${y})`)
        if (childc.width < W) {
          let leftline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
          leftline.setAttribute('x1', gap)
          leftline.setAttribute('y1', y + childc.height / 2)
          leftline.setAttribute('x2', gap + (W - childc.width) / 2)
          leftline.setAttribute('y2', y + childc.height / 2)
          leftline.setAttribute('stroke', 'yellow')
          leftline.setAttribute('stroke-width', 1)
          g.appendChild(leftline)
          let righttline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
          righttline.setAttribute('x1', gap + (W - childc.width) / 2 + childc.width)
          righttline.setAttribute('y1', y + childc.height / 2)
          righttline.setAttribute('x2', W + gap)
          righttline.setAttribute('y2', y + childc.height / 2)
          righttline.setAttribute('stroke', 'yellow')
          righttline.setAttribute('stroke-width', 1)
          g.appendChild(righttline)
        }
        if (y + childc.height / 2 < H / 2) {
          let lPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
          lPath.setAttribute('d', `M 0 ${H / 2} C ${gap} ${H / 2}, 0 ${y + childc.height / 2}, ${gap} ${y + childc.height / 2}`)
          lPath.setAttribute('fill', 'none')
          lPath.setAttribute('stroke', 'red')
          lPath.setAttribute('stroke-width', '1')
          g.appendChild(lPath)
          let rPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
          rPath.setAttribute('d', `M ${W + gap} ${y + childc.height / 2} C ${gap + W + gap} ${y + childc.height / 2}, ${W + gap} ${H / 2}, ${gap + W + gap} ${H / 2}`)
          rPath.setAttribute('fill', 'none')
          rPath.setAttribute('stroke', 'red')
          rPath.setAttribute('stroke-width', '1')
          g.appendChild(rPath)
        } else if (y + childc.height / 2 > H / 2) {
          let lPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
          lPath.setAttribute('d', `M 0 ${H / 2} C ${gap} ${H / 2}, 0 ${y + childc.height / 2}, ${gap} ${y + childc.height / 2}`)
          lPath.setAttribute('fill', 'none')
          lPath.setAttribute('stroke', 'blue')
          lPath.setAttribute('stroke-width', '1')
          g.appendChild(lPath)
          let rPath = document.createElementNS('http://www.w3.org/2000/svg', 'path')
          rPath.setAttribute('d', `M ${W + gap} ${y + childc.height / 2} C ${gap + W + gap} ${y + childc.height / 2}, ${W + gap} ${H / 2}, ${gap + W + gap} ${H / 2}`)
          rPath.setAttribute('fill', 'none')
          rPath.setAttribute('stroke', 'blue')
          rPath.setAttribute('stroke-width', '1')
          g.appendChild(rPath)
        } else if (content) {
          let lLine = document.createElementNS('http://www.w3.org/2000/svg', 'line')
          lLine.setAttribute('x1', 0)
          lLine.setAttribute('y1', H / 2)
          lLine.setAttribute('x2', gap)
          lLine.setAttribute('y2', H / 2)
          lLine.setAttribute('stroke', 'green')
          lLine.setAttribute('stroke-width', 1)
          g.appendChild(lLine)
          let rline = document.createElementNS('http://www.w3.org/2000/svg', 'line')
          rline.setAttribute('x1', gap + W)
          rline.setAttribute('y1', H / 2)
          rline.setAttribute('x2', gap + W + gap)
          rline.setAttribute('y2', H / 2)
          rline.setAttribute('stroke', 'green')
          rline.setAttribute('stroke-width', 1)
          g.appendChild(rline)
        }
        g.appendChild(child)
        if (i !== branchess.length - 1) {
          y += childc.height + gap
        } else {
          y += childc.height
        }
      }
      return {
        ele: g,
        width: W + gap * 2,
        height: H
      }
    }
    function drawbranch(node) {
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let gap = 20
      let x = 0
      let H = 0
      let W = 0
      for (let i = 0; i < node.element.length; i++) {
        let childc = draw(node.element[i])
        if (childc.height > H) {
          H = childc.height
        }
        let child = childc.ele
        child.setAttribute('transform', `translate(${x}, 0)`)
        g.appendChild(child)
        if (i !== node.element.length - 1) {
          let line = document.createElementNS('http://www.w3.org/2000/svg', 'line')
          line.setAttribute('x1', x + childc.width)
          line.setAttribute('y1', childc.height / 2)
          line.setAttribute('x2', x + childc.width + gap)
          line.setAttribute('y2', childc.height / 2)
          line.setAttribute('stroke', 'red')
          line.setAttribute('stroke-width', 1)
          g.appendChild(line)
          x += childc.width + gap
        } else {
          x += childc.width
        }
      }
      return {
        ele: g,
        width: x,
        height: H,
      }
    }
    function drawGroup(node) {
      let g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      let childc = drawbranchess(node.branches, false)
      let padding = 1
      let rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
      rect.setAttribute('x', - padding)
      rect.setAttribute('y', - padding)
      rect.setAttribute('width', childc.width + padding * 2)
      rect.setAttribute('height', childc.height + padding * 2)
      rect.setAttribute('stroke', 'gray')
      rect.setAttribute('fill', 'none')
      rect.setAttribute('stroke-dasharray', '1, 1')
      g.appendChild(rect)
      g.appendChild(childc.ele)
      return {
        ele: g,
        width: childc.width + padding * 2,
        height: childc.height + padding * 2
      }
    }
    let ast = parseRegex('(c|c)')
    let result = drawbranchess(ast)
    result.ele.setAttribute('transform', 'translate(50, 50)')
    svg.appendChild(result.ele)
  </script>
</body>
