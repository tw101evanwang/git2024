<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>regex101</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    .containerPro {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .head {
      display: flex;
      height: 55px;
      align-items: center;
      padding-left: 12px;
      padding-right: 12px;
      background-color: #163452;
      font-family: Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 14.4px;
      vertical-align: baseline;
    }

    .head * {
      font-size: 19.2px;
    }

    .headR {
      flex: 1;
      display: flex;
      justify-content: flex-end;

    }

    .both {
      display: flex;
      flex-direction: row;
      flex: 1;
    }

    .left {
      background: #f0f0f0;
      width: 289px;
      height: 100%;
    }

    @media (max-width: 1080px) {
      .left {
        display: none;
      }
    }

    .right {
      flex: 1;
      height: 100%;
    }

    .inner {
      display: flex;
      flex-direction: row;
      height: 100%;
    }

    .r-left {
      background-color: #0000;
      flex: 1;
      height: 100%;
    }

    .r-right {
      background-color: #f0f0f0;
      width: 300px;
      height: 100%;
    }

    input,
    button {
      outline: auto;
    }

    #result em:nth-of-type(odd) {
      font-style: normal;
    }

    #result em:nth-of-type(even) {
      font-style: normal;
    }

    #output {
      width: 400px;
      height: 200px;

      #result {
        width: 100%;
        height: 100%;
        white-space: pre-wrap;
        overflow: auto;
        border: 1px green solid;
        background-color: white;
        font-family: monospace;
        font-size: 30px;
        padding: 10px;
      }

      [group-index='1'] {
        background-color: red;
      }

      [group-index='2'] {
        background-color: blue;
      }

      [group-index='3'] {
        background-color: green;
      }

      [group-index='4'] {
        background-color: purple;
      }

      [group-index='5'] {
        background-color: lawngreen;
      }

      [group-index='6'] {
        background-color: orange;
      }

      [group-index='7'] {
        background-color: darkorchid;
      }

      [group-index='8'] {
        background-color: rgb(202, 185, 32);
      }

      [group-index='9'] {
        background-color: hotpink;
      }

      em:not(:has(:hover)):hover {
        outline: 2px solid palegreen;
      }

      em:not(:has(:hover)):hover em {
        background-color: inherit;
      }

      .zero-width {
        border-left: 2px dotted red;
        margin-left: -1px;
        margin-right: -1px;
      }
    }

    .geoup-Hover-Tips {
      position: fixed;
      background-color: black;
      color: aqua;
      display: none;
      white-space: pre;
      border-radius: 10px;
      padding: 4px;
      transform: translateX(-50%) translateY(-100%) translateY(-5px);
      margin: 0;
    }

    .geoup-Hover-Tips::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      height: 0;
      width: 0;
      border-top: 10px solid black;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
    }
  </style>
</head>

<body>
  <div class="containerPro">
    <div class="head">
      <h1 class="">
        <a href="https://www.baidu.com/" style="text-decoration: none">
          <span class="" style="color: #dcdcdc;">regular</span>
          <span class="" style="color: #dcdcdc;">expressions</span>
          <sub class="" style="color: #dcdcdc;font-size: 12px;">101</sub>
        </a>
      </h1>
      <div class="headR">
        <button class="">Upgrade to Pro</button>
        <button class="">Enterprise</button>
        <button class="">Sponsor</button>
        <button class="">Info</button>
      </div>
    </div>
    <div class="both">
      <div class="left"></div>
      <div class="right">
        <div class="inner">
          <div class="r-left">
            <div>Regular Expression</div>
            <input class="border" type="text" id="reInput" value="(a(a)(..)a)">
            <button class="border" onclick="run()">Run</button>
            <span id="sta"></span>
            <div>Regex Flags</div>
            <label for=""><input type="checkbox" id="flag-g" checked>g</label>
            <label for=""><input type="checkbox" id="flag-m">m</label>
            <label for=""><input type="checkbox" id="flag-i">i</label>
            <label for=""><input type="checkbox" id="flag-y">y</label>
            <label for=""><input type="checkbox" id="flag-u">u</label>
            <label for=""><input type="checkbox" id="flag-s">s</label>
            <label for=""><input type="checkbox" id="flag-d" checked>d</label>
            <label for=""><input type="checkbox" id="flag-v">v</label>
            <div>Test String</div>
            <div id="output">
              <div id="result" contenteditable>aaaaa 1 okech 2 apwaa aaaaa begin 4 afdgo 5 avoma 6 adsnn 7 anvka 8 avsma</div>
              <div class="geoup-Hover-Tips"></div>
            </div>
          </div>
          <div class="r-right"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function run() {
      let flags = getFlags()
      let reString = reInput.value
      let re
      try {
        re = new RegExp(reString, flags)
      } catch (e) {
        if (e instanceof SyntaxError) {
          return
        }
      }
      let testString = result.textContent
      let html = ''
      let lastLastIndex = 0
      let matchIndex = 0
      let done = false
      setTimeout(() => {
        if (done == false) {
          sta.textContent = "processing..."
        }
      }, 1000)
      sta.textContent = "processing..."
      getMatchesFromWorker(re, testString, (matches) => {
        sta.textContent = "ok"
        done = true
        for (let match of matches) {
          html += testString.slice(lastLastIndex, match.index)
          if (match[0].length == 0) {
            re.lastIndex++
            html += highLight(match, matchIndex)
            lastLastIndex = match.index
          } else {
            html += highLight(match, matchIndex)
            lastLastIndex = match.index + match[0].length
          }
          matchIndex++
        }
        html += testString.slice(lastLastIndex)
        let selectionPosition = getcursorpos()
        result.innerHTML = html
        restore(result, selectionPosition)
      }, () => {
        sta.textContent = "timeout"
      })
    }
    //同一个anchorOffset = 5 在文本节点里：第 5 个字符 ; 在元素节点里：第 5 个子节点位置.所以需要做 DOM 遍历
    function getcursorpos() {
      let position = 0
      let cursorPos = window.getSelection()
      traverse(result, textNode => {
        if (textNode === cursorPos.anchorNode) {
          position += cursorPos.anchorOffset
          return false
        } else {
          position += textNode.textContent.length
        }
      })
      return position
    }
    function traverse(node, f) {
      for (let child of node.childNodes) {
        if (child.nodeType === Node.TEXT_NODE) {
          if (f(child) === false) {
            return false
          }
        } else if (child.nodeType === Node.ELEMENT_NODE) {
          if (traverse(child, f) === false) {
            return false
          }
        }
      }
    }
    function restore(node, index) {
      let sele = window.getSelection()
      traverse(node, textNode => {
        if (index > textNode.textContent.length) {
          index -= textNode.textContent.length
        } else {
          sele.setPosition(textNode, index)
          return false
        }
      })
    }
    let results = document.querySelector("#result")
    let geoupHoverTips = document.querySelector(".geoup-Hover-Tips")
    results.addEventListener("mousemove", (event) => {
      if (event.target.matches("em")) {
        let X = event.clientX
        let Y = event.clientY
        //getBoundingClientRect()：返回整个元素的外接矩形（一个矩形）
        //getClientRects()：返回元素所有占用的矩形区域（可能多个矩形）换行文本
        let box = event.target.getClientRects()
        let boxs = currentbox(box, Y)
        let em = event.target.dataset.title
        geoupHoverTips.textContent = em
        geoupHoverTips.style.display = 'block'
        geoupHoverTips.style.left = X + 'px'
        geoupHoverTips.style.top = boxs.top + 'px'
      }
    })
    results.addEventListener('mouseout', (event) => {
      if (event.target.matches("em")) {
        geoupHoverTips.style.display = 'none'
      }
    })
    function currentbox(box, y) {
      if (box.length === 1) {
        return box[0]
      }
      for (let b of box) {
        if (y >= b.top && y <= b.bottom) {
          return b
        }
      }
    }
    function getFlags() {
      let flags = ['g', 'm', 'i', 'y', 'u', 's', 'd', 'v']
      return flags.filter(it => {
        let element = document.getElementById('flag-' + it)
        if (element.checked) {
          return true
        } else {
          return false
        }
      }).join('')
    }
    function highLight(match, matchIndex) {
      if (match.length == 0) {
        let info = [
          `Math ${matchIndex}`,
          `---`,
          `Group 0: [empty string]`,
          `Pos: ${match.index}- ${match.index}`,
        ].join('\n')
        return `<em class='zero-width' data-title='${info}'></em>`
      }
      let res = new Array(match[0].length + 1).fill('')
      let groupindex = 0
      for (let indexs of match.indices) {
        let start = indexs[0] - match.index
        let end = indexs[1] - match.index
        let info = [
          `Math ${matchIndex}`,
          `---`,
          `Group: ${groupindex}`,
          `Pos: ${indexs[0]}- ${indexs[1]}`,
        ].join('\n')
        res[start] += `<em data-title= '${info}' group-index='${groupindex}'>`
        res[end] = `</em>` + res[end]
        groupindex++
      }
      let result = ''
      for (let i = 0; i < match[0].length; i++) {
        result += res[i] + match[0][i]
      }
      result += res[match[0].length]
      return result
    }
    function getMatchesFromWorker(re, string, f, g) {
      let worker = new Worker("./regex101-worker.js")
      let success = false
      worker.addEventListener("message", (e) => {
        let matches = e.data
        worker.terminate()
        success = true
        f(matches)
      })
      setTimeout(() => {
        if (success == false) {
          worker.terminate()
          g()
        }
      }, 2000)
      worker.postMessage({
        re: re,
        string: string,
      })
    }
  </script>
</body>

</html>
